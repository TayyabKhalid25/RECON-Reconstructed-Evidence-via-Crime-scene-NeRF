name: Delete Old Merged Branches

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete branches merged over 15 days ago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Calculate the date 15 days ago in ISO 8601 format
          THRESHOLD_DATE=$(date -d "15 days ago" --utc +%Y-%m-%dT%H:%M:%SZ)
          
          echo "Finding merged PRs older than $THRESHOLD_DATE..."
          
          # 1. Fetch default branch and active remote branches
          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')
          EXISTING_BRANCHES=$(gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name')
          
          # 2. Query GitHub for unique branch names of PRs merged before the threshold date
          OLD_MERGED_BRANCHES=$(gh pr list --state merged --limit 100 --json headRefName,mergedAt \
            -q ".[] | select(.mergedAt < \"$THRESHOLD_DATE\") | .headRefName" | sort -u)
          
          # 3. Filter only for branches that actually still exist and are not the default branch
          TO_DELETE=()
          for branch in $OLD_MERGED_BRANCHES; do
            if [ "$branch" = "$DEFAULT_BRANCH" ]; then
              continue
            fi
            if echo "$EXISTING_BRANCHES" | grep -Fxq "$branch"; then
              TO_DELETE+=("$branch")
            fi
          done
          
          if [ ${#TO_DELETE[@]} -eq 0 ]; then
            echo "No existing branches found that were merged over 15 days ago."
            exit 0
          fi
          
          # 4. Delete only existing candidate branches
          for branch in "${TO_DELETE[@]}"; do
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch"
          done