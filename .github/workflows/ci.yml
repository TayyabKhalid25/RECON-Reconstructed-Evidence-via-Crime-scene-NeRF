name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Runs from day one: keeps binaries and oversized files out of the repo.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No banned binaries tracked
        run: |
          banned=$(git ls-files | grep -Ei '\.(ply|splat|mp4|mov|avi|mkv)$' || true)
          if [ -n "$banned" ]; then
            echo "These file types never enter git (see AGENTS.md):"
            echo "$banned"
            exit 1
          fi
      - name: No files over 10 MB tracked
        run: |
          big=$(git ls-files | while read -r f; do
            [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 10485760 ] && echo "$f"
          done || true)
          if [ -n "$big" ]; then
            echo "Files over 10 MB tracked, move them out of git:"
            echo "$big"
            exit 1
          fi
      - name: No .env committed
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '.env.example' || true)
          if [ -n "$leaked" ]; then
            echo "Env files committed, rotate every secret in them now:"
            echo "$leaked"
            exit 1
          fi

  # Activates by itself once web/package.json exists; green no-op until then.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web app
        id: has
        run: echo "web=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.web == 'yes'
        with:
          # Matches the Node pin in docs/STACK.md (22 LTS; v22.23.2 installed).
          # CI on a different major than everyone develops against defeats the
          # point of pinning it.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.has.outputs.web == 'yes'
        working-directory: web
        run: npm ci
      - name: Generate Prisma client and route types
        if: steps.has.outputs.web == 'yes'
        working-directory: web
        run: |
          # Both read local files only and need no database.
          # Without them typecheck fails on missing @prisma/client types and on
          # Next 16's generated RouteContext union, which lives in .next/types
          # and is gitignored.
          npx prisma generate
          npx next typegen
      - name: Lint, typecheck and unit tests
        if: steps.has.outputs.web == 'yes'
        working-directory: web
        # `npm run verify` is typecheck + lint + the check:* scripts, and it
        # grows as scripts are added rather than needing a workflow edit.
        # Was `npm run lint --if-present` plus `npm test --if-present`, and
        # since there is no `test` script that second line was a silent no-op:
        # typecheck and the check:* scripts had never run in CI once. That is
        # how 44 broken `@/lib/*` imports reached main unnoticed.
        # A single script keeps CI and the local pre-push command identical, so
        # "it passed locally" and "it passed in CI" mean the same thing.
        run: npm run verify

  # Activates by itself once gpu/ contains Python; green no-op until then.
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect python
        id: has
        run: echo "py=$([ -n "$(find gpu -name '*.py' -print -quit 2>/dev/null)" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.has.outputs.py == 'yes'
        with:
          python-version: "3.11"
      - name: Lint
        if: steps.has.outputs.py == 'yes'
        run: |
          pip install ruff
          ruff check gpu
      - name: Test
        if: steps.has.outputs.py == 'yes'
        run: |
          pip install pytest
          if [ -d gpu/tests ]; then pip install -r gpu/requirements.txt 2>/dev/null || true; pytest gpu/tests; else echo "no tests yet"; fi

  # Unity tests stay local per AGENTS.md; CI does not attempt them.
